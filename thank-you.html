<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thanks — Appreciate Me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Barlow,sans-serif;background:#050507;color:#f0f0f0;display:grid;place-items:center;min-height:100vh;background-image:linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);background-size:44px 44px}
.wrap{max-width:720px;padding:32px}.card{background:#0d0d12;border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:40px;box-shadow:0 0 0 1px rgba(0,232,122,.05),0 20px 60px rgba(0,0,0,.35)}
.kicker{color:#00e87a;text-transform:uppercase;letter-spacing:.18em;font-size:12px;margin-bottom:12px}
h1{font-family:'Barlow Condensed',sans-serif;font-size:64px;line-height:.95;margin:0 0 16px;text-transform:uppercase}
p{font-size:20px;line-height:1.6;color:#b6b6c7;margin:0 0 24px}.btn{display:inline-block;background:#00e87a;color:#000;padding:14px 20px;border-radius:8px;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="kicker">Waitlist received</div><h1>You’re on the list.</h1><p>Got it — your email was submitted. Thanks for checking out Appreciate Me early.</p><a class="btn" href="/">Back to site</a></div></div>
</body>
</html>
